<style>
    <!-- /* footer.css */

    /* ========================================
       Variables
       ======================================== */
    :root {
        --footer-bg: var(--darkBackground);
        --footer-accent: var(--secondary);
        --footer-accent-hover: var(--secondary);
        --footer-text-muted: var(--secondary);
        --footer-max-width: 1100px;
        --footer-padding-y: 80px;
        --footer-padding-x: 40px;
        --footer-icon-size: 48px;
        --footer-icon-gap: 12px;
    }

    /* ========================================
       Base Footer Styles
       ======================================== */
    .site-footer {
        background-color: var(--darkBackground);
        width: 100%;
        box-sizing: border-box;
    }

    .site-footer *,
    .site-footer *::before,
    .site-footer *::after {
        box-sizing: border-box;
    }

    .footer-container {
        max-width: var(--footer-max-width);
        margin: 0 auto;
        padding: var(--footer-padding-y) var(--footer-padding-x);
    }

    /* ========================================
       Two-Column Layout (Desktop)
       ======================================== */
    .footer-columns {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
        gap: 60px;
    }

    /* ========================================
       Left Column: Navigation
       ======================================== */
    .footer-nav {
        flex: 0 0 auto;
    }

    .footer-nav-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .footer-nav-list li {
        margin: 0;
        padding: 0;
    }

    .footer-nav-list a {
        color: var(--secondary);
        text-decoration: underline;
        text-underline-offset: 4px;
        font-size: 18px;
        font-family: Georgia, 'Times New Roman', serif;
        transition: color 0.2s ease;
        display: inline-block;
        padding: 4px 0;
    }

    .footer-nav-list a:hover,
    .footer-nav-list a:focus {
        color: var(--secondary);
        outline: none;
    }

    .footer-nav-list a:focus-visible {
        outline: 2px solid var(--secondary);
        outline-offset: 4px;
        border-radius: 2px;
    }

    /* ========================================
       Right Column: Social
       ======================================== */
    .footer-social {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .footer-social-heading {
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 22px;
        color: var(--secondary);
        margin: 0 0 24px 0;
        letter-spacing: 0.5px;
    }

    /* ========================================
       Social Icons Row
       ======================================== */
    .footer-social-icons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--footer-icon-gap);
        margin-bottom: 32px;
    }

    .social-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--footer-icon-size);
        height: var(--footer-icon-size);
        min-width: 44px;
        min-height: 44px;
        border: 1.5px solid var(--secondary);
        border-radius: 50%;
        color: var(--secondary);
        text-decoration: none;
        transition: all 0.2s ease;
    }

    .social-icon svg {
        width: 22px;
        height: 22px;
    }

    .social-icon:hover,
    .social-icon:focus {
        background-color: var(--secondary);
        color: var(--darkBackground);
        outline: none;
    }

    .social-icon:focus-visible {
        outline: 2px solid var(--secondary);
        outline-offset: 3px;
    }

    /* ========================================
       Footer Text
       ======================================== */
    .footer-copyright,
    .footer-location {
        font-family: Georgia, 'Times New Roman', serif;
        color: var(--secondary);
        font-size: 15px;
        margin: 0;
        line-height: 1.6;
    }

    .footer-copyright {
        margin-bottom: 6px;
    }

    /* ========================================
       Responsive: Tablet & Mobile
       ======================================== */
    @media (max-width: 768px) {
        :root {
            --footer-padding-y: 60px;
            --footer-padding-x: 24px;
        }

        .footer-columns {
            flex-direction: column;
            align-items: center;
            gap: 48px;
        }

        .footer-nav {
            order: 1;
        }

        .footer-social {
            order: 2;
        }

        .footer-nav-list {
            align-items: center;
            text-align: center;
        }

        .footer-social-heading {
            font-size: 20px;
        }
    }

    @media (max-width: 480px) {
        :root {
            --footer-padding-y: 48px;
            --footer-padding-x: 16px;
            --footer-icon-size: 44px;
            --footer-icon-gap: 10px;
        }

        .footer-nav-list a {
            font-size: 16px;
        }

        .footer-social-heading {
            font-size: 18px;
        }

        .footer-copyright,
        .footer-location {
            font-size: 14px;
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
        }
    }
</style>
